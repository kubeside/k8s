apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filserver
  namespace: reverse-proxy-app
spec:
  parentRefs:
    - name: http-gateway
      namespace: gateways-system
  hostnames:
    - filserver.imavgs.no
  rules:
    - backendRefs:
        - name: filserver
          port: 80
----
apiVersion: v1
kind: Service
metadata:
  name: filserver
  namespace: reverse-proxy-app
spec:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: filserver
  namespace: reverse-proxy-app
subsets:
- addresses:
  - ip: "10.7.0.10"
  ports:
  - port: 8080
    protocol: TCP

