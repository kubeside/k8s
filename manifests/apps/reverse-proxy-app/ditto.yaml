apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ditto
  namespace: reverse-proxy-app
spec:
  parentRefs:
    - name: http-gateway
      namespace: gateways-system
  hostnames:
    - ditto.imavgs.no
  rules:
    - backendRefs:
        - name: ditto
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ditto
  namespace: reverse-proxy-app
spec:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ditto
  namespace: reverse-proxy-app
subsets:
- addresses:
  - ip: "10.0.0.1"
  ports:
  - port: 8888
    protocol: TCP

