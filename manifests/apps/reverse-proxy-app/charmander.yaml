apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: charmander
  namespace: reverse-proxy-app
spec:
  parentRefs:
    - name: http-gateway
      namespace: gateways-system
  hostnames:
    - charmander.imavgs.no
  rules:
    - backendRefs:
        - name: charmander
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: charmander
  namespace: reverse-proxy-app
spec:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: charmander
  namespace: reverse-proxy-app
subsets:
- addresses:
  - ip: "10.3.0.4"
  ports:
  - port: 8006
    protocol: TCP

