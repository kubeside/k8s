apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zubat
  namespace: reverse-proxy-app
spec:
  parentRefs:
    - name: http-gateway
      namespace: gateways-system
  hostnames:
    - zubat.imavgs.no
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zubat
          port: 443
          weight: 1
---
apiVersion: v1
kind: Service
metadata:
  name: zubat
  namespace: reverse-proxy-app
spec:
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
      appProtocol: HTTPS
---
apiVersion: v1
kind: Endpoints
metadata:
  name: zubat
  namespace: reverse-proxy-app
subsets:
- addresses:
  - ip: "10.3.0.3"
  ports:
  - port: 8006
    protocol: TCP