apiVersion: apps/v1
kind: Deployment
metadata:
  name: metro-app
  namespace: metro-app
  annotations:
    secret.reloader.stakater.com/reload: secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metro-app
  template:
    metadata:
      labels:
        app: metro-app
    spec:
      containers:
        - name: metro-app
          image: ghcr.io/kubeside/images/metro@sha256:f9e32fbba699a06461b0f1d0b990857b6a920fc7c184b4ab68de01806b872c9f
          ports:
            - containerPort: 80
          env:
            - name: OPNSENSE_API_URL
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: OPNSENSE_API_URL
            - name: OPNSENSE_AUTH
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: OPNSENSE_AUTH
            - name: METRO_MODULES
              value: "opnsense.js dns.js metro.js fetch_speed.js"
